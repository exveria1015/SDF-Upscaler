[workspace]
members = [
  "crates/sdf-upscaler",
  "crates/sdf-upscale-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/Eonshore/SDF-Upscaler"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.4", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = [
  "bmp",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
walkdir = "=2.5.0"
